<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ae4235"><title>帽子が長すぎます、シェフ！</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"></head><body><main id="app" data-phase="title"><header><div><small>本日の売上</small><b id="score">0</b><small>円</small></div><div><small>あと</small><b id="time">60</b><small>秒</small></div><button id="pause" aria-label="一時停止">Ⅱ</button></header><div class="ticker" id="ticker">帽子で刻む → 鍋が仕上げる → 帽子で皿を飛ばす</div><section id="board"><canvas id="game" width="480" height="720" aria-label="長すぎるコック帽で料理する厨房"></canvas></section><div id="pad"><strong>指でシェフを動かす ↔ ↕</strong><small>下のエリアでも操作できます</small></div><section id="title" class="screen"><p class="eyebrow">厨房、営業中。常識、品切れ。</p><h1>帽子が長すぎます、<br><em>シェフ！</em></h1><canvas id="hero" width="480" height="390" aria-label="長い帽子に困る新人コック"></canvas><p class="quote">高さは、やる気のあらわれだ！</p><p class="sub">振って刻む。飛ばして出す。<br>厨房が壊れても、60秒は営業する。</p><button id="start" class="primary">開店する →</button><p class="best">最高売上 <b id="best">0</b> 円</p></section><section id="intro" class="screen" hidden><p class="eyebrow">初出勤の朝</p><canvas id="scene" width="480" height="390"></canvas><h2 id="speaker">店長</h2><p id="line"></p><button id="next" class="primary">つづく →</button></section><section id="ready" class="float" hidden><strong id="count">3</strong><p>指で動かして、帽子の先を振ろう！</p></section><section id="paused" class="screen shade" hidden><div class="card"><p class="eyebrow">火は止めてあります</p><h2>休憩も、大事な仕込み。</h2><button id="resume" class="primary">厨房に戻る →</button><button class="secondary home">店じまいしてタイトルへ</button></div></section><section id="results" class="screen shade" hidden><div class="card"><p class="eyebrow">本日の営業、終了！</p><h2 id="grade"></h2><canvas id="resultHero" width="480" height="180"></canvas><strong id="final" class="result-score"></strong><p id="stats"></p><p id="comment" class="quote"></p><button id="retry" class="primary">同じ厨房でもう一回 →</button><button class="secondary home">タイトルへ</button></div></section><p id="storage" hidden>記録を保存できませんが、ゲームは遊べます。</p></main><script type="module" src="./app.js"></script></body></html>
